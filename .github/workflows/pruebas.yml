name: Pruebas

# Se ejecutan en cada empujón a main y en cada pull request. Sin esto, nadie
# sabe si un cambio rompe algo hasta que alguien lanza las pruebas a mano.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    # Windows porque el proyecto es para Windows: hay código que usa el
    # registro del sistema y rutas propias de esta plataforma, así que probarlo
    # en Linux daría una falsa sensación de que funciona.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        # Solo las que hacen falta para las pruebas. Las de voz (torch,
        # speechbrain, faster-whisper) pesan cientos de megas y descargan
        # modelos, así que las pruebas que las necesitan se saltan solas.
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML httpx numpy python-dotenv psutil PySide6

      - name: Ejecutar las pruebas
        # Sin pantalla en el runner: Qt necesita saberlo para no fallar al
        # construir ventanas en las pruebas.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short
